    Publications:
      - title: Superconducting qubits in a flip-chip architecture
        # authors:
        #   - Christopher R. Conner
        publisher: Applied Physics Letters
        releaseDate: 2021-06
        url: https://doi.org/10.1063/5.0050173
        summary: Benchmarking lifetime, coherence time, and entangling gate fidelity of two superconducting qubits on galvanically separate substrates, assembled in a modular flip-chip geometry.

      - title: Energy Harvesting With a Liquid-Metal Microfluidic Influence Machine
        # authors:
        #   - Christopher R. Conner
        publisher: Physical Review Applied
        releaseDate: 2018-04
        url: https://link.aps.org/doi/10.1103/PhysRevApplied.9.044008
        summary: Demonstrating an energy-harvesting technology utlizing microfluid droplets of liquid metal and oil in a microfluidic realization of a Wimshurst influence machine.

