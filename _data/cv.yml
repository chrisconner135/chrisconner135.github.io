    Experience:
      - company: Quantum Information and Nanomechanics Laboratory, University of Chicago
        position: Graduate Research Assistant
        location: Chicago, IL
        start_date: 2017
        end_date: present
        summary: Graduate student researching superconducting qubits and mechanical systems in the quantum regime in the lab of Professor Andrew Cleland.
        highlights:
          - Designed, simulated, fabricated, and measured a superconducting qubit experiment that culminated in randomized benchmarking of two-qubit entangling gates in a modular geometry; resulted in a first author publication in Applied Physics Letters and a presentation at APS March Meeting
          - Collaborated with colleagues to perform measurements on a qubit-resonator system and develop analysis code used for Wigner tomography of exotic quantum states; presented the work at APS March Meeting
          - Fabricated and measured high-Q acoustic microwave resonators with computation and sensing applications; currently writing a paper on these measurements and working towards quantum operation through integration with novel qubit designs; presented the work at APS March Meeting
          - Coordinated planning and installation of multiple Bluefors dilution refrigerators and have an active role in their continued maintenance and operation
          - Mentored multiple sets of undergraduate interns in various projects, with topics ranging from acoustic resonator design to microwave measurement techniques to software development for experiment control; also mentored graduate students in cleanroom fabrication techniques

      - company: Microfluidics Laboratory, University of California Santa Barbara
        position: Undergraduate Research Assistant
        location: Santa Barbara, CA
        start_date: 2016
        end_date: 2017
        summary: Undergraduate researcher working on microfluidics and education outreach projects in the lab of Professor Sumita Pennathur.
        highlights:
          - Fabricated and measured a microfluidic realization of a Wimshurst energy converter; work resulted in a first author publication in Physical Review Applied and a presentation at the Southern California Micro and Nanofluidics Symposium
          - Developed and led hands-on engineering education outreach activities at a local elementary school; communicated the lesson design in a presentation at the Southern California Micro and Nanofluidics Symposium

      - company: Particle Physics Laboratory, University of California Santa Barbara
        position: Undergraduate Research Assistant
        location: Santa Barbara, CA
        start_date: 2016
        end_date: 2016
        summary: Undergraduate researcher working on a detector project in the lab of Professor David Stuart.
        highlights:
        - Contributed to the developmet and assembly of a particle detector utilizing a three-dimensional grid os cintillating fibers and silicon photomultipliers

